<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banin's Restobar POS — Accounting</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1><a href="pos.html" style="color:inherit; text-decoration:none;">🍻 Banin's Restobar</a><span class="logo-hint" data-admin-only>(click this to return to tabs)</span></h1>
    <nav>
      <a href="reports.html" data-admin-only>Reports</a>
      <a href="accounting.html" class="active" data-admin-only>Accounting</a>
      <a href="inventory.html" data-admin-only>Inventory</a>
      <a href="employees.html" data-admin-only>Employees</a>
      <div class="profile-menu">
        <button class="secondary" id="profileBtn">👤 <span id="profileName">Account</span> ▾</button>
        <div class="dropdown" id="profileDropdown">
          <div class="dropdown-header" id="dropdownName"></div>
          <div class="dropdown-sub" id="dropdownEmail"></div>
          <hr/>
          <a href="#" id="changePasswordLink">Change Password</a>
          <a href="#" id="themeToggleLink">🌙 Dark mode</a>
          <a href="#" id="signOutLink" class="danger-link">Sign out</a>
        </div>
      </div>
    </nav>
  </div>

  <div class="container">
    <div class="filter-row" id="filterRow">
      <button data-range="day" class="active">Daily</button>
      <button data-range="week">Weekly</button>
      <button data-range="month">Monthly</button>
      <button data-range="year">Yearly</button>
    </div>

    <div class="stat-cards">
      <div class="stat-card">
        <div class="label">Revenue</div>
        <div class="value" id="statRevenue">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">Expenses</div>
        <div class="value" id="statExpenses">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">Net Profit</div>
        <div class="value" id="statNet">₱0.00</div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar" style="margin-bottom:14px">
        <h3 style="margin:0">Add expense</h3>
      </div>
      <div style="display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap:10px; align-items:start;">
        <input id="expDesc" placeholder="Description (e.g. Ice, LPG refill)" />
        <input id="expAmount" type="number" step="0.01" min="0" placeholder="Amount" />
        <input id="expCategory" placeholder="Category (optional)" />
        <button id="addExpenseBtn">Add</button>
      </div>
      <div class="error" id="expError"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">Expenses in range</h3>
      <table>
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead>
        <tbody id="expensesTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/accounting.js"></script>
</body>
</html>
