<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banin's Restobar POS — Reports</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1><a href="pos.html" style="color:inherit; text-decoration:none;">🍻 Banin's Restobar</a><span class="logo-hint" data-admin-only>(click this to return to tabs)</span></h1>
    <nav>
      <a href="reports.html" class="active" data-admin-only>Reports</a>
      <a href="accounting.html" data-admin-only>Accounting</a>
      <a href="inventory.html" data-admin-only>Inventory</a>
      <a href="employees.html" data-admin-only>Employees</a>
      <div class="profile-menu">
        <button class="secondary" id="profileBtn">👤 <span id="profileName">Account</span> ▾</button>
        <div class="dropdown" id="profileDropdown">
          <div class="dropdown-header" id="dropdownName"></div>
          <div class="dropdown-sub" id="dropdownEmail"></div>
          <hr/>
          <a href="#" id="changePasswordLink">Change Password</a>
          <a href="#" id="themeToggleLink">🌙 Dark mode</a>
          <a href="#" id="signOutLink" class="danger-link">Sign out</a>
        </div>
      </div>
    </nav>
  </div>

  <div class="container">
    <div class="filter-row" id="filterRow">
      <button data-range="day" class="active">Daily</button>
      <button data-range="week">Weekly</button>
      <button data-range="month">Monthly</button>
      <button data-range="year">Yearly</button>
    </div>

    <div class="stat-cards">
      <div class="stat-card">
        <div class="label">Total Sales</div>
        <div class="value" id="statTotal">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">Tabs Closed</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Average Tab</div>
        <div class="value" id="statAvg">₱0.00</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Sales by period</h3>
      <table>
        <thead><tr><th>Period</th><th>Tabs</th><th>Sales</th></tr></thead>
        <tbody id="periodTableBody"></tbody>
      </table>
    </div>

    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">Closed tabs in range</h3>
      <table>
        <thead><tr><th>Tab</th><th>Closed</th><th>Items</th><th>Total</th></tr></thead>
        <tbody id="tabsTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
