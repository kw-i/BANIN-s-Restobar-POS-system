<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Banin's Restobar</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>🔑 Set a new password</h1>
      <p class="hint" id="hint">Checking your link…</p>
      <input id="newPassword" type="password" placeholder="New password" autocomplete="new-password" style="display:none" />
      <div class="error" id="error"></div>
      <button id="saveBtn" style="width:100%; display:none">Save new password</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const hintEl = document.getElementById("hint");
    const inputEl = document.getElementById("newPassword");
    const btnEl = document.getElementById("saveBtn");
    const errorEl = document.getElementById("error");

    // Supabase JS automatically picks up the recovery token from the
    // URL fragment and turns it into a temporary session.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        hintEl.textContent = "Enter a new password for your account.";
        inputEl.style.display = "block";
        btnEl.style.display = "block";
      }
    });

    // Fallback: if the event already fired before we attached the
    // listener, check for an existing session.
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        hintEl.textContent = "Enter a new password for your account.";
        inputEl.style.display = "block";
        btnEl.style.display = "block";
      } else {
        setTimeout(() => {
          if (inputEl.style.display === "none") {
            hintEl.textContent = "This link is invalid or expired. Request a new one from the login page.";
          }
        }, 2000);
      }
    });

    btnEl.addEventListener("click", async () => {
      const password = inputEl.value;
      errorEl.textContent = "";
      if (!password || password.length < 6) {
        errorEl.textContent = "Password must be at least 6 characters.";
        return;
      }
      btnEl.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        errorEl.textContent = error.message;
        btnEl.disabled = false;
        return;
      }
      hintEl.textContent = "Password updated! Redirecting to login…";
      inputEl.style.display = "none";
      btnEl.style.display = "none";
      await supabaseClient.auth.signOut();
      setTimeout(() => window.location.href = "index.html", 1500);
    });
  </script>
</body>
</html>
