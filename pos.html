<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banin's Restobar POS</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>🍻 Banin's Restobar</h1>
    <nav>
      <a href="pos.html" class="active">Tabs</a>
      <a href="reports.html" data-admin-only>Reports</a>
      <a href="accounting.html" data-admin-only>Accounting</a>
      <a href="inventory.html" data-admin-only>Inventory</a>
      <a href="employees.html" data-admin-only>Employees</a>
      <div class="profile-menu">
        <button class="secondary" id="profileBtn">👤 <span id="profileName">Account</span> ▾</button>
        <div class="dropdown" id="profileDropdown">
          <div class="dropdown-header" id="dropdownName"></div>
          <div class="dropdown-sub" id="dropdownEmail"></div>
          <hr/>
          <a href="#" id="changePasswordLink">Change Password</a>
          <a href="#" id="themeToggleLink">🌙 Dark mode</a>
          <a href="#" id="signOutLink" class="danger-link">Sign out</a>
        </div>
      </div>
    </nav>
  </div>

  <div class="container">
    <div class="toolbar">
      <div class="sync-indicator" id="syncStatus">All synced</div>
      <div style="display:flex; gap:10px;">
        <button class="secondary" id="refreshBtn">↻ Refresh</button>
        <button id="newTabBtn">+ New Tab</button>
      </div>
    </div>

    <div id="tabsGrid" class="tabs-grid"></div>
    <div id="emptyState" class="empty" style="display:none">No open tabs. Start one with "+ New Tab".</div>
  </div>

  <button id="deleteAllBtn" class="danger" style="position:fixed; bottom:20px; left:20px; z-index:20;">
    🗑 Delete All Tabs
  </button>

  <!-- Tab detail modal -->
  <div class="modal-backdrop" id="tabModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <div>
          <input id="tabLabelInput" style="margin:0; font-size:16px; font-weight:700;" />
          <div class="hint" id="tabOpenedAt" style="margin-top:4px"></div>
        </div>
        <button class="ghost" id="closeModalBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="menu-grid" id="menuGrid"></div>
        <div id="orderList"></div>
        <div class="total-line">
          <span>Total</span>
          <span id="tabTotal">₱0.00</span>
        </div>
        <label class="hint" style="display:block; margin-top:16px;">Notes (visible to everyone on this tab)</label>
        <textarea id="tabNotes" rows="2" placeholder="e.g. allergic to peanuts, wants extra spicy..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="danger" id="deleteTabBtn" style="display:none">Delete Tab</button>
        <div style="display:flex; gap:10px; margin-left:auto;">
          <button id="closeTabBtn" style="display:none">Close / Pay Out</button>
          <button class="secondary" id="confirmEditBtn" style="display:none">Confirm Edit</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pos.js"></script>
</body>
</html>
